# 以下所有项都可被命令行覆盖（新版 param.h 提供）：
#   ./unitree_mujoco -r g1 -s scene_29dof.xml -i 0 -n lo
robot: "g1"  # Robot name, "go2", "b2", "b2w", "h1", "go2w", "g1", "humanoid_ultra"

# 相对路径会被解析为 /unitree_robots/[robot]/[robot_scene]；也可写绝对路径
robot_scene: "scene_g1_29dof_terrain.xml"
# robot_scene: "scene_29dof.xml"
# robot_scene: "/home/ustczxh/humanoid/unitree_mujoco/data/varied_scenes/var_0025/scene_varied.xml"

domain_id: 0  # Domain id   g1 用 0，go2 用 1
interface: "lo" # "lo" 表示本地回环接口（localhost），适合仿真

use_joystick: 1 # 启用游戏手柄模拟 Unitree 的无线控制器
joystick_type: "xbox" # support "xbox" and "switch" gamepad layout
joystick_device: "/dev/input/js0" # Device path
joystick_bits: 16 # Some game controllers may only have 8-bit accuracy

print_scene_information: 1 # Print link, joint and sensors information of robot

enable_elastic_band: 1 # 虚拟弹力带，用于吊起 h1/g1（键盘 7/8 调长度，9 开关）

# 感知版 walk 的高程图（unitree_rl_lab 的 Velocity_Rough 状态订阅 rt/perceptive/height_map）。
# 在 MuJoCo 里复刻训练侧 torso_link 上的 17x11 @ 0.1 m 高程扫描，见 src/height_map_publisher.h。
enable_height_map: 1
height_map_topic: "rt/perceptive/height_map"
height_map_body: "torso_link"   # g1 / h1 用 torso_link；其它机器人按训练里 RayCaster 挂的 link 改
height_map_rate: 50             # Hz；和策略同频。10 Hz 时地图最多滞后 100 ms（1 m/s 下差一整格），
                                # 实测摔倒率 1.9% -> 3.4%；50 Hz 下这一项基本消失
                                # 控制器超过 0.3 s 没收到会退回平地并告警

# 查看器里的感知叠加显示（只画不算，键盘 M 开关高程图、C 开关深度相机视野）
enable_perception_overlay: 1
overlay_show_height_map: 1   # 策略实际消费的 17x11 网格：蓝=低 绿=平 红=高，未知格不画
overlay_show_camera: 1       # D435 深度视野(87x58 deg, 俯仰 47.6 deg)：青=地形 橙=打到自己 黄=视锥边
overlay_rate: 20             # Hz
overlay_camera_cols: 24
overlay_camera_rows: 14
overlay_camera_range: 4.0    # m，超出不画
